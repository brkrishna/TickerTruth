name: Nightly Data Refresh

on:
  schedule:
    # 2:00 AM IST = 20:30 UTC previous day (Mon–Fri trading days)
    - cron: "30 20 * * 1-5"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      run_date:
        description: "Override run date (YYYY-MM-DD). Defaults to today."
        required: false
        type: string
      dry_run:
        description: "Dry run — skip Dolt commit"
        required: false
        type: boolean
        default: false

env:
  PYTHONPATH: .
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Dolt's git-remote support (see dolt/CLAUDE.md "Persistence") lets this
  # repo's own GitHub remote double as the Dolt remote — Dolt stores its
  # chunk data on refs/dolt/data, a custom ref invisible in the GitHub UI
  # and separate from normal git history. GITHUB_TOKEN is sufficient; no
  # extra secret needed.
  DOLT_REMOTE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

# Nightly only keeps the underlying reference data current in Dolt
# (extract -> ... -> load) on trading days, so corporate-action/lineage
# issues surface as small daily diffs instead of piling up. The public
# release — website update, R2 sample publish — happens once a month via
# release.yml, triggered by a version tag, since that's the actual cadence
# customers receive.
jobs:
  refresh:
    name: Data Refresh Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # needed to push Dolt state + curated data to this repo's refs

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version

      - name: Configure Dolt identity
        run: |
          dolt config --global --add user.name  "TickerTruth Bot"
          dolt config --global --add user.email "bot@tickertruth.com"

      # Restores dolt/.dolt from the previous run's pushed state (see "Push
      # Dolt state" step below). Falls back to a fresh `dolt init` only on
      # the very first run ever, when the remote has no dolt data yet — a
      # `dolt clone` against an empty/nonexistent remote data ref fails,
      # which is how we detect "first run" vs. "restore".
      - name: Restore or bootstrap Dolt state from git remote
        run: |
          if dolt clone "$DOLT_REMOTE_URL" dolt_remote_state; then
            echo "Restored existing Dolt state from remote."
            rm -rf dolt/.dolt
            mv dolt_remote_state/.dolt dolt/.dolt
            rm -rf dolt_remote_state
            # No `dolt remote add origin` here — `dolt clone` already
            # configures `origin` pointing at $DOLT_REMOTE_URL. Adding it
            # again fails with "remote already exists" (regression found
            # 2026-08-14, broke every nightly run since 2026-08-07 — see
            # tasks.md INFRA-1).
          else
            echo "No existing Dolt data on remote — bootstrapping fresh."
            rm -rf dolt_remote_state
            cd dolt
            dolt init
            dolt sql < schema.sql
            dolt add -A
            dolt commit -m "init schema"
            dolt remote add origin "$DOLT_REMOTE_URL"
            dolt push -u origin main
          fi

      - name: Run pipeline (data refresh only — no publish)
        env:
          RUN_DATE:  ${{ github.event.inputs.run_date }}
          DRY_RUN:   ${{ github.event.inputs.dry_run }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python pipelines/run.py \
            --tasks extract,normalize,lineage,adjust,validate,load \
            ${RUN_DATE:+--date $RUN_DATE} \
            $([[ "$DRY_RUN" == "true" ]] && echo "--dry-run")

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: quality-report-${{ github.run_id }}
          path: data/staging/quality_report_*.json
          if-no-files-found: ignore

      # Pushes whatever `load` committed this run (empty/no-op if the run was
      # --dry-run or validate failed, since run_load only skips the *commit*
      # in those cases — nothing new to push). Also pushes any new tag(s)
      # (run_load tags every successful commit as vYYYY.MM.DD) since `dolt
      # push origin main` alone does not carry tags.
      - name: Push Dolt state to git remote
        if: success()
        run: |
          cd dolt
          dolt push origin main
          for t in $(dolt tag | awk '{print $1}'); do
            dolt push origin "$t"
          done

      # data/curated is gitignored in the main branch (it's derived, daily
      # output) but release.yml needs today's curated CSVs on a later,
      # separate checkout — so persist them to a dedicated orphan branch
      # using plain git, rather than trying to reconstruct them from Dolt's
      # table schema (which drops/renames columns on import; see
      # dolt_importer.py's _TABLE_COLUMNS).
      - name: Push curated data to git branch
        if: success()
        run: |
          git config user.name  "TickerTruth Bot"
          git config user.email "bot@tickertruth.com"
          git fetch origin curated-data:curated-data 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/curated-data; then
            git worktree add curated-data-worktree curated-data
          else
            git worktree add -B curated-data curated-data-worktree
          fi
          rm -rf curated-data-worktree/data
          mkdir -p curated-data-worktree/data
          cp -r data/curated curated-data-worktree/data/
          cd curated-data-worktree
          git add -A
          if git diff --cached --quiet; then
            echo "No curated-data changes"
          else
            git commit -m "curated data: ${GITHUB_RUN_ID}"
          fi
          git push origin curated-data

      # Belt-and-suspenders manual-recovery copy, kept for workflow_dispatch
      # runs. With the two push steps above, Dolt state and curated data are
      # now durably persisted on every successful run — this artifact is a
      # convenience for pulling one specific run's state locally without
      # cloning the git-remote refs, not the primary persistence mechanism.
      - name: Package Dolt state and curated data
        if: github.event_name == 'workflow_dispatch'
        run: |
          tar -czf dolt-state.tar.gz -C dolt .dolt
          tar -czf curated-data.tar.gz -C data curated

      - name: Upload Dolt state and curated data
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dolt-and-curated-${{ github.run_id }}
          path: |
            dolt-state.tar.gz
            curated-data.tar.gz
          retention-days: 7
